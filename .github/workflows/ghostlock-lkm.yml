name: Build GhostLock LKM + ksud

# Builds the rebranded LKM (`kernelsu.ko` for the Pixel 11 Pro Fold's
# android16-6.12 KMI, bound to com.lixingchi.kernelsu / our manager signer by
# kernel/Kbuild) and a ksud that embeds it.
#
# The manager APK is built separately (it needs the signing keystore): locally
# with `gradlew assembleRelease -PKSU_PACKAGE_NAME=com.lixingchi.kernelsu
# -PKSU_NAME=GhostLock`, or through build-manager.yml with the keystore secrets.
# The LKM and ksud do not need the keystore, so this workflow needs no secrets.

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/ghostlock-lkm.yml'
      - '.github/workflows/ddk-lkm.yml'
      - '.github/workflows/ksud.yml'
      - 'kernel/**'
      - 'userspace/**'
      - 'uapi/**'

permissions:
  contents: read

jobs:
  build-lkm:
    uses: ./.github/workflows/ddk-lkm.yml
    with:
      kmi: android16-6.12

  build-ksud:
    needs: build-lkm
    uses: ./.github/workflows/ksud.yml
    with:
      target: aarch64-linux-android
      pack_lkm: true
      ksu_package_name: com.lixingchi.kernelsu

  publish-ksud:
    needs: build-ksud
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download the built ksud
        uses: actions/download-artifact@v8
        with:
          name: ksud-aarch64-linux-android
          path: dist/ksud

      - name: Publish the rolling GhostLock release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          chmod +x dist/ksud/ksud
          (cd dist/ksud && sha256sum ksud > ksud.sha256)
          # A fixed tag/asset name lets another repository fetch a stable URL
          # (https://github.com/<repo>/releases/download/ghostlock-latest/ksud)
          # without any cross-repository token.
          # Every command passes --repo explicitly: this job has no checkout,
          # so gh cannot infer the repository from a git remote.
          if ! gh release view ghostlock-latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create ghostlock-latest \
              --repo "$GITHUB_REPOSITORY" \
              --title "GhostLock CI artifacts" \
              --notes "Rolling ksud built by ghostlock-lkm.yml from the GhostLock KernelSU fork."
          fi
          gh release upload ghostlock-latest --repo "$GITHUB_REPOSITORY" \
            dist/ksud/ksud dist/ksud/ksud.sha256 --clobber
          gh release view ghostlock-latest --repo "$GITHUB_REPOSITORY" --json assets \
            --jq '.assets[] | "\(.name) \(.size) bytes"'

      - name: Notify Root-My-Pixel (optional)
        env:
          RMP_DISPATCH_TOKEN: ${{ secrets.RMP_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$RMP_DISPATCH_TOKEN" ]; then
            echo "RMP_DISPATCH_TOKEN is not set; skipping the cross-repository dispatch."
            echo "Root-My-Pixel still picks the release up on its next push or manual build."
            exit 0
          fi
          GH_TOKEN="$RMP_DISPATCH_TOKEN" gh api \
            --method POST \
            repos/doccstat/Root-My-Pixel/dispatches \
            -f event_type=ghostlock-ksud-published
